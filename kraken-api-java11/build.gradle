plugins {
    id 'java-library'
}

// Compiles the Kraken API 5.5.1 sources this plugin still reaches, to class file
// version 55. See ../kraken-api-5.5.1-java11.patch and ../NOTICE. Login and
// break-handler sources stay in the tree and are excluded below. GameHooks and
// HooksLoader do not map the login hook group. Modules the prayer flicker does
// not reach are not in this tree.

repositories {
    mavenCentral()
    maven { url = 'https://repo.runelite.net' }
}

dependencies {
    compileOnly 'org.slf4j:slf4j-api:1.7.25'
    compileOnly 'com.google.code.gson:gson:2.8.5'
    compileOnly 'com.google.guava:guava:31.1-jre'
    compileOnly 'com.google.inject:guice:4.2.2'
    compileOnly 'net.runelite:client:1.13.8'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

// Not compiled and not shipped. LoginService reads credentials.properties, and the
// break-handler package exists to call it. LoginHooks is only used by that code.
// The sources stay in this tree; see ../kraken-api-5.5.1-java11.patch.
sourceSets.main.java.exclude 'com/kraken/api/service/ui/login/**'
sourceSets.main.java.exclude 'com/kraken/api/core/script/breakhandler/**'
sourceSets.main.java.exclude 'com/kraken/api/core/hooks/LoginHooks.java'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

jar {
    archiveBaseName = 'kraken-api'
    archiveVersion = '5.5.1'
    archiveClassifier = 'java11'
}
